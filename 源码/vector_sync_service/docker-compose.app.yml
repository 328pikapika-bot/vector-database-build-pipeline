services:
  vector-sync-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker-hosted.example.invalid/nstl/vector-sync-service:${IMAGE_TAG:-latest}
    container_name: vector-sync-service
    init: true
    environment:
      ENV: ${ENV:-prod}
      TZ: Asia/Shanghai
      UPLOAD_DIR: /app/upload
      KAFKA_DUMP_FILE: /app/out/kafka_messages.jsonl
      KAFKA_ERROR_DUMP_FILE: /app/out/kafka_messages_error.jsonl
      KAFKA_PROCESSED_DUMP_FILE: /app/out/kafka_messages_processed.jsonl
    ports:
      - "${VECTOR_SYNC_PORT:-8000}:8000"
    volumes:
      - vector-sync-upload:/app/upload
      - vector-sync-out:/app/out
      - vector-sync-runtime:/app/.runtime
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  vector-sync-upload:
  vector-sync-out:
  vector-sync-runtime:
