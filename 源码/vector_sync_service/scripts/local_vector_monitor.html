<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三路向量同步监控</title>
  <style>
    :root { --ink:#172033; --muted:#677388; --line:#dfe4ec; --paper:#fff; --bg:#f5f7fa; --blue:#1463cc; --green:#167347; --red:#c63d3d; --amber:#936c10; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 Arial,"Microsoft YaHei",sans-serif; }
    main { max-width:1180px; margin:0 auto; padding:24px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:18px; }
    h1 { margin:0; font-size:24px; letter-spacing:0; }
    .sub, .meta { margin:5px 0 0; color:var(--muted); font-size:13px; }
    .tools { display:flex; align-items:center; gap:10px; white-space:nowrap; color:var(--muted); font-size:13px; }
    button { height:32px; padding:0 11px; border:1px solid #b9c4d3; border-radius:5px; color:var(--ink); background:var(--paper); cursor:pointer; font:inherit; }
    button:hover { border-color:var(--blue); color:var(--blue); }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--red); }
    .dot.ok { background:var(--green); }
    .summary { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; }
    .metric, .panel { border:1px solid var(--line); border-radius:7px; background:var(--paper); }
    .metric { min-height:122px; padding:16px; }
    .metric.primary { border-top:3px solid var(--blue); }
    .label { color:var(--muted); font-size:12px; font-weight:700; }
    .value { margin-top:10px; font-size:27px; line-height:1; font-weight:700; }
    .detail { margin-top:11px; min-height:20px; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
    .panel { margin-top:12px; overflow:hidden; }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); }
    h2 { margin:0; font-size:16px; letter-spacing:0; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; }
    th, td { padding:13px 16px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
    tr:last-child td { border-bottom:0; }
    th { background:#fafbfc; color:var(--muted); font-size:12px; font-weight:700; }
    .name { font-weight:700; }
    .mono { color:var(--muted); font:11px Consolas,"Cascadia Mono",monospace; overflow-wrap:anywhere; }
    .ok { color:var(--green); font-weight:700; }
    .warn { color:var(--amber); font-weight:700; }
    .bad { color:var(--red); font-weight:700; }
    .alert { display:none; margin-top:12px; padding:11px 14px; border:1px solid #efc6c6; border-radius:7px; color:var(--red); background:#fff7f7; white-space:pre-wrap; }
    .mongo-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin-top:12px; }
    .mongo-body { padding:14px 16px; }
    .mongo-metrics { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px 14px; }
    .mongo-metric { min-width:0; }
    .mongo-metric-label, .mini-title { color:var(--muted); font-size:11px; }
    .mongo-metric-value { margin-top:2px; font-size:19px; font-weight:700; }
    .mini-title { margin-top:14px; margin-bottom:5px; font-weight:700; }
    .status-list, .cause-list { display:grid; gap:4px; }
    .status-item, .cause-item { display:flex; justify-content:space-between; gap:10px; font-size:12px; }
    .cause-item span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .empty { color:var(--muted); font-size:12px; }
    footer { margin-top:12px; color:var(--muted); font-size:12px; }
    @media (max-width:1000px) { .mongo-grid { grid-template-columns:1fr; } }
    @media (max-width:800px) { main { padding:16px; } header { flex-direction:column; } .summary { grid-template-columns:1fr 1fr; } .panel { overflow-x:auto; } table { min-width:760px; } }
    @media (max-width:480px) { .summary { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>三路向量同步监控</h1>
        <p id="updated" class="sub">正在读取数据</p>
      </div>
      <div class="tools">
        <span id="dot" class="dot"></span><span id="connection">正在连接</span>
        <button id="refresh" type="button" title="立即刷新">刷新</button>
      </div>
    </header>

    <section class="summary" aria-label="入库总览">
      <article class="metric primary"><div class="label">三集合已入库</div><div id="total" class="value">--</div><div class="detail">Milvus row_count</div></article>
      <article class="metric"><div class="label">文献</div><div id="documents-rows" class="value">--</div><div id="documents-detail" class="detail">--</div></article>
      <article class="metric"><div class="label">全文切片</div><div id="fulltext_chunks-rows" class="value">--</div><div id="fulltext_chunks-detail" class="detail">--</div></article>
      <article class="metric"><div class="label">图片</div><div id="images-rows" class="value">--</div><div id="images-detail" class="detail">--</div></article>
    </section>

    <section class="panel" aria-label="同步进度">
      <div class="panel-head"><h2>同步进度</h2><span id="history" class="meta">--</span></div>
      <table>
        <thead><tr><th style="width:25%">通道</th><th style="width:17%">已入库</th><th style="width:16%">Kafka 待处理</th><th style="width:17%">日均消费</th><th style="width:15%">预计剩余</th><th style="width:10%">状态</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
    <section class="mongo-grid" aria-label="Mongo失败统计">
      <article class="panel mongo-card"><div class="panel-head"><h2>文献级失败</h2><span id="failure_records-name" class="mono">--</span></div><div id="failure_records-body" class="mongo-body"></div></article>
      <article class="panel mongo-card"><div class="panel-head"><h2>全文任务</h2><span id="fulltext_tasks-name" class="mono">--</span></div><div id="fulltext_tasks-body" class="mongo-body"></div></article>
      <article class="panel mongo-card"><div class="panel-head"><h2>图片任务</h2><span id="image_tasks-name" class="mono">--</span></div><div id="image_tasks-body" class="mongo-body"></div></article>
    </section>
    <div id="error" class="alert"></div>
    <footer>预计剩余天数按 Kafka 已提交位点的完整日均速度计算。Mongo 统计仅读取失败和任务状态，不展示原始记录。</footer>
  </main>
  <script>
    const KEYS = ["documents", "fulltext_chunks", "images"];
    const MONGO_KEYS = ["failure_records", "fulltext_tasks", "image_tasks"];
    const STATUS_LABELS = { PENDING:"待处理", RETRYING:"重试中", DONE:"已处理", SKIPPED_STALE:"过期跳过", GAVE_UP:"重试终止", HELD_HISTORY:"历史冻结", LEASED:"处理中", SUCCESS:"成功", FAILURE:"失败", SKIPPED:"跳过" };
    const fmt = value => Number(value || 0).toLocaleString("zh-CN");
    const html = value => { const el = document.createElement("span"); el.textContent = value == null ? "" : String(value); return el.innerHTML; };
    const duration = seconds => {
      const value = Number(seconds || 0);
      if (value >= 86400) return `${Math.floor(value / 86400)} 天`;
      if (value >= 3600) return `${Math.floor(value / 3600)} 小时`;
      return `${Math.floor(value / 60)} 分钟`;
    };
    const days = value => Number(value) < 0.1 ? "不到 0.1 天" : `${Number(value).toFixed(1)} 天`;
    function rateText(rate) {
      if (rate?.status === "ready") return `${fmt(rate.messages_per_day)} 条/天`;
      if (rate?.status === "rough") return `粗估 ${fmt(rate.messages_per_day)} 条/天`;
      if (rate?.status === "warming_up") return `历史不足 ${duration(rate.available_seconds)}`;
      if (rate?.status === "counter_reset") return "位点回退";
      return "暂无数据";
    }
    function etaText(eta) {
      if (eta?.status === "complete") return "已追平";
      if (eta?.status === "ready") return `约 ${days(eta.days)}`;
      if (eta?.status === "rough") return `粗估 ${days(eta.days)}`;
      if (eta?.status === "offset_unknown") return "消费位点未知";
      return "等待日均数据";
    }
    function status(lane) {
      if (lane.kafka_error || lane.collection_error || !lane.collection_exists) return ["异常", "bad"];
      if (!lane.committed_known) return ["位点未知", "warn"];
      if (lane.eta?.status === "complete") return ["已追平", "ok"];
      if (lane.daily_rate?.status === "rough") return ["粗估", "warn"];
      if (lane.daily_rate?.status !== "ready") return ["积累历史", "warn"];
      return ["正常", "ok"];
    }
    function mongoBody(item) {
      if (!item || item.error) return `<div class="empty">读取失败</div>`;
      const metrics = [
        ["总量", item.total],
        ["待处理", item.pending_count],
        ["处理中", item.processing_count],
        ["已处理", item.handled_count],
        ["可重试失败", item.retryable_failures],
      ];
      const statuses = Object.entries(item.statuses || {});
      const causes = [...(item.top_error_codes || []).map(row => ["错误", row]), ...(item.top_stages || []).map(row => ["阶段", row])];
      return `<div class="mongo-metrics">${metrics.map(([label, value]) => `<div class="mongo-metric"><div class="mongo-metric-label">${label}</div><div class="mongo-metric-value">${fmt(value)}</div></div>`).join("")}</div>
        <div class="mini-title">状态</div><div class="status-list">${statuses.length ? statuses.map(([key, value]) => `<div class="status-item"><span>${STATUS_LABELS[key] || html(key)}</span><strong>${fmt(value)}</strong></div>`).join("") : `<div class="empty">暂无记录</div>`}</div>
        <div class="mini-title">主要原因</div><div class="cause-list">${causes.length ? causes.slice(0, 10).map(([kind, row]) => `<div class="cause-item"><span title="${html(row.value)}">${kind} · ${html(row.value)}</span><strong>${fmt(row.count)}</strong></div>`).join("") : `<div class="empty">暂无错误统计</div>`}</div>`;
    }
    function renderMongo(data) {
      const mongo = data.mongo || {};
      const collections = mongo.collections || {};
      MONGO_KEYS.forEach(key => {
        const item = collections[key];
        document.getElementById(`${key}-name`).textContent = item?.name || "--";
        document.getElementById(`${key}-body`).innerHTML = mongo.connected ? mongoBody(item) : `<div class="empty">Mongo 未连接</div>`;
      });
    }
    function render(data) {
      const lanes = data.lanes || {};
      document.getElementById("total").textContent = fmt(data.milvus?.total_rows);
      document.getElementById("updated").textContent = `更新于 ${new Date(data.ts).toLocaleString("zh-CN")}`;
      document.getElementById("history").textContent = `快照 ${fmt(data.history?.sample_count)} 条 · 日均窗口 ${data.history?.rate_window_days || 1} 天`;
      KEYS.forEach(key => {
        const lane = lanes[key] || {};
        document.getElementById(`${key}-rows`).textContent = fmt(lane.row_count);
        document.getElementById(`${key}-detail`).textContent = etaText(lane.eta);
      });
      document.getElementById("rows").innerHTML = KEYS.map(key => {
        const lane = lanes[key] || {};
        const [label, style] = status(lane);
        const lag = lane.lag == null ? "--" : fmt(lane.lag);
        return `<tr><td><div class="name">${html(lane.label || key)}</div><div class="mono">${html(lane.collection || "--")}</div></td><td>${fmt(lane.row_count)}</td><td>${lag}</td><td>${html(rateText(lane.daily_rate))}</td><td>${html(etaText(lane.eta))}</td><td class="${style}">${label}</td></tr>`;
      }).join("");
      renderMongo(data);
      const connected = Boolean(data.milvus?.connected && data.kafka?.connected && data.mongo?.ready);
      document.getElementById("dot").className = `dot ${connected ? "ok" : ""}`;
      document.getElementById("connection").textContent = connected ? "Milvus / Kafka / Mongo 已连接" : "依赖连接异常";
      const errors = [data.milvus?.error, data.kafka?.error, data.mongo?.error].filter(Boolean);
      const alert = document.getElementById("error");
      alert.style.display = errors.length ? "block" : "none";
      alert.textContent = errors.join("\n");
    }
    async function refresh() {
      const button = document.getElementById("refresh");
      button.disabled = true;
      try {
        const response = await fetch("/api/summary", {cache:"no-store"});
        const data = await response.json();
        if (!response.ok) throw new Error(JSON.stringify(data));
        render(data);
      } catch (error) {
        const alert = document.getElementById("error");
        alert.style.display = "block";
        alert.textContent = `刷新失败：${error.message || error}`;
      } finally { button.disabled = false; }
    }
    document.getElementById("refresh").addEventListener("click", refresh);
    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
