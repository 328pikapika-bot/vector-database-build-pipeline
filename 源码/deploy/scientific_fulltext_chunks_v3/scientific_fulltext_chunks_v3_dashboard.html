<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>scientific_fulltext_chunks_v3 · 导入进度</title>
<style>
:root{color-scheme:light;font-family:Arial,"Microsoft YaHei",sans-serif;color:#17212e;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:0 auto;padding:36px 24px 72px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}h1{font-size:26px;margin:0 0 10px;word-break:break-word}p{line-height:1.6;color:#526273}.tag{border-radius:999px;padding:8px 14px;background:#e5edf6;color:#254466;white-space:nowrap;font-weight:700}.tag.live{background:#def7e9;color:#176741}.tag.error{background:#fee8e8;color:#a32a2a}.panel{background:#fff;border:1px solid #e5eaf0;border-radius:16px;padding:24px;margin-top:22px;box-shadow:0 4px 18px #1735550a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.metric{background:#f8fafc;border-radius:12px;padding:18px}.label{font-size:14px;color:#607187}.value{font-size:27px;font-weight:700;margin-top:10px;letter-spacing:-.03em}.value.small{font-size:20px}.track{height:16px;background:#e9eef5;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:#2177d4;transition:width .4s}.line{display:flex;justify-content:space-between;gap:16px;font-size:14px;color:#607187;margin:12px 0}.warn{background:#fff8e7;border:1px solid #f5dfad;border-radius:12px;padding:14px;color:#684f17}.footer{font-size:13px;color:#728095;margin-top:18px}.errorBox{color:#a32a2a}.hidden{display:none}@media(max-width:720px){header{display:block}.tag{display:inline-block}.grid{grid-template-columns:1fr 1fr}.wrap{padding:24px 14px}}@media(max-width:470px){.grid{grid-template-columns:1fr}h1{font-size:21px}}
</style></head><body><main class="wrap"><header><div><h1>scientific_fulltext_chunks_v3</h1><p>231 生产 Milvus 实例 · 全文来源 ID 补齐与复制进度</p></div><span class="tag" id="state">读取中</span></header>
<section class="panel"><div class="line"><strong>复制进度</strong><strong id="percent">—</strong></div><div class="track"><div class="bar" id="bar"></div></div><div class="line"><span>当前已确认写入 <b id="copied">—</b> 条</span><span>源集合 <b id="source">—</b> 条</span></div></section>
<section class="panel grid"><div class="metric"><div class="label">最近一分钟写入</div><div class="value" id="minute">—</div></div><div class="metric"><div class="label">最近一分钟实际速度</div><div class="value" id="rate">—</div></div><div class="metric"><div class="label">预计剩余</div><div class="value" id="remaining">—</div></div><div class="metric"><div class="label">累计补入来源 ID</div><div class="value" id="added">—</div></div><div class="metric"><div class="label">按最近一分钟速度预计复制完成</div><div class="value small" id="eta">—</div></div><div class="metric"><div class="label">已完成前缀</div><div class="value" id="prefix">—</div></div></section>
<section class="panel"><p class="warn">复制期间不建索引。完成时间只估算数据复制，不包含之后统一建索引和验收；历史重复主键单独记录，尚待处理。</p><div class="line"><span>程序状态：<b id="details">—</b></span><span>在途批次：<b id="inflight">—</b></span></div><div class="line"><span>重复主键待处理：<b id="duplicates">—</b></span><span>最后确认写入：<b id="last">—</b></span></div><div class="footer">页面每 60 秒自动刷新。数据时间：<span id="updated">—</span>。<a href="/api/status">查看 JSON 状态</a></div><p class="errorBox hidden" id="error"></p></section></main>
<script>
const $=id=>document.getElementById(id),fmt=n=>n==null?'—':Number(n).toLocaleString('zh-CN'),dt=v=>v?new Date(v).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',weekday:'long',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'暂无法估计';
async function refresh(){try{let r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error('状态接口返回 '+r.status);let x=await r.json();$('state').textContent=x.live?'正在复制':'已暂停或状态过期';$('state').className='tag '+(x.live?'live':'error');$('percent').textContent=x.progress_percent.toFixed(3)+'%';$('bar').style.width=Math.min(100,x.progress_percent)+'%';$('copied').textContent=fmt(x.target_rows_confirmed);$('source').textContent=fmt(x.source_total);$('minute').textContent=fmt(x.last_minute_rows)+' 条';$('rate').textContent=x.last_minute_rows_per_second.toFixed(2)+' 条/秒';$('remaining').textContent=fmt(x.remaining_estimate)+' 条';$('added').textContent=fmt(x.source_ids_added_total)+' 条';$('eta').textContent=dt(x.estimated_copy_finish_at);$('prefix').textContent=x.prefixes_finished+' / '+x.prefixes_total;$('details').textContent=x.status;$('inflight').textContent=fmt(x.submitted_inflight_batches);$('duplicates').textContent=fmt(x.duplicate_keys_quarantined_after_transfer);$('last').textContent=dt(x.last_confirmed_at);$('updated').textContent=dt(x.at);$('error').classList.add('hidden')}catch(e){$('state').textContent='状态读取失败';$('state').className='tag error';$('error').textContent=e.message;$('error').classList.remove('hidden')}}refresh();setInterval(refresh,60000);
</script></body></html>
